<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackhole</title>
    <style>
        label {
            font-size: 19px;
        }
        body {
            font-family: Helvetica, sans-serif;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            height: 150vh;
            background-color: #f4f4f4;
            background-image: url('HD-wallpaper-tesseract.jpg'); /* Arka plan resmi */
            background-size: cover; /* Resmi ekran boyutuna göre büyüt */
            background-position: center; /* Resmin ortalanması */
        }
        h1 {
            font-size: 50px; /* Başlık boyutunu büyüt */
            margin-bottom: 40px; /* Başlık ile form arasına boşluk ekle */
            text-align: center;
            color: rgb(146, 78, 32);
        }
        .form-container {
            background: rgba(255, 255, 255, 0.8);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.1);
            width: 550px;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: px solid #ccc;
            border-radius: 20px;
            font-size: 16px;
        }
        .image-button {
            width: 100px;
            height: 100px;
            border: none;
            background: url('blackhole.jpg') no-repeat center center;
            background-size: cover;
            cursor: pointer;
            border-radius: 50%; /* Butonu yuvarlak yapmak için */
            transition: transform 0.3s ease-in-out;
        }

        .image-button:hover {
            transform: scale(1.1); /* Üzerine gelince büyüme efekti */
        }
        h1 {
            font-size: px; /* Başlık eklenirse büyüklük ayarı */
        }
        @keyframes fadeOutBackground {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        body.fade-out {
            animation: fadeOutBackground 1.5s forwards; /* Arka plan solacak */
        }

        #fullscreenGIFContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #fullscreenGIF {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

    </style>
</head>
<body>
    <div class="form-container">
        <form action="#" method="GET">
            <h1>Blackhole Library</h1>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>
            <label for="pwd">Password:</label>
            <input type="password" id="pwd" name="pwd" placeholder="Enter your password"><br><br>
            <!-- Buton -->
            <button class="image-button" onclick="openFullScreen()"></button>

            <!-- GIF Modal (Başlangıçta Gizli) -->
            <div id="fullscreenGIFContainer">
                <img id="fullscreenGIF" src="IF6S.gif" alt="Animated GIF">
            </div>
        </form>
    </div>
    <script>
        function openFullScreen() {
            let gifContainer = document.getElementById("fullscreenGIFContainer");
            let body = document.body;
            let gif = document.getElementById("fullscreenGIF");

            

            // Arka planın solmasını başlat
            body.classList.add("fade-out");

            // Tam ekranı aç
            gifContainer.style.display = "flex"; 
    
            // Tam ekran kapatmak için ESC tuşuna basılınca kapat
            document.addEventListener("keydown", function(event) {
                if (event.key === "Escape") {
                    closeFullScreen();
                }
            });
    
            // Kullanıcı GIF'e tıklarsa kapansın
            gifContainer.addEventListener("click", closeFullScreen);
        }
    
        function closeFullScreen() {
            let gifContainer = document.getElementById("fullscreenGIFContainer");
            
            let body = document.body;

            // Arka planı eski haline getir
            body.classList.remove("fade-out");

            // Tam ekranı kapat
            gifContainer.style.display = "none"; 
        }
    </script>
</body>
</html>
